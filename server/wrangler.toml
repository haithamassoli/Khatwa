name = "khatwa-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Create with: npx wrangler kv namespace create QUOTA  (then paste the printed id here)
[[kv_namespaces]]
binding = "QUOTA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
MONTHLY_SEARCHES = "100"     # DRIVE matrix calls per install per month (Amman time)
IP_DAILY_REQUESTS = "3000"   # all proxied requests per client IP per UTC day
FEEDBACK_DAILY_MAX = "30"    # community point votes per install per UTC day
POINTS_CELL_DECIMALS = "3"   # community point grid: coordinates rounded to this many decimals

# Secrets (not in this file):
#   npx wrangler secret put GOOGLE_MAPS_KEY
#   npx wrangler secret put APP_SHARED_SECRET   (optional)
